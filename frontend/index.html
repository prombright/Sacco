<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SACCO</title>
    <!-- The theme before anything draws, so dark mode never flashes white -->
    <script src="/brand/theme-init.js"></script>
    <script src="/brand/splash.js" defer></script>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading">
      <style>
        #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(circle at 30% 20%, #1f2788, #0d1240 70%); color: #fff; font-family: system-ui, sans-serif; }
        #splash .jar { position: relative; width: 92px; height: 74px; }
        #splash .coin { position: absolute; left: 21px; width: 50px; height: 16px; border-radius: 50%; background: linear-gradient(#f7cd63, #eea90f); box-shadow: inset 0 -3px 0 #c98a08; animation: splash-drop 1.5s cubic-bezier(.3, 1.3, .6, 1) infinite both; }
        #splash .coin:nth-child(1) { bottom: 0; animation-delay: 0s; }
        #splash .coin:nth-child(2) { bottom: 12px; animation-delay: .16s; }
        #splash .coin:nth-child(3) { bottom: 24px; animation-delay: .32s; }
        #splash .coin:nth-child(4) { bottom: 36px; animation-delay: .48s; }
        #splash .coin:nth-child(5) { bottom: 48px; animation-delay: .64s; }
        #splash p { margin: 0; font-size: 15px; letter-spacing: .02em; color: #dfe2f9; min-height: 1.3em; }
        @keyframes splash-drop { 0% { transform: translateY(-90px); opacity: 0; } 30%, 80% { transform: none; opacity: 1; } 100% { transform: none; opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { #splash .coin { animation: none; } }
      </style>
      <div class="jar" aria-hidden="true"><i class="coin"></i><i class="coin"></i><i class="coin"></i><i class="coin"></i><i class="coin"></i></div>
      <p id="splash-text">Counting the shillings…</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
